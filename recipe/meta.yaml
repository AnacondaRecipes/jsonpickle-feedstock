{% set name = "jsonpickle" %}
{% set version = "4.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f86e18f13e2b96c1c1eede0b7b90095bbb61d99fedc14813c44dc2f361dbbae1

build:
  skip: true  # [py<38]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation

requirements:
  host:
    - pip
    - python
    - build  # [py<312]
    - setuptools >=61.2
    - setuptools_scm >=6.0
    - twine
  run:
    - python

test:
  source_files:
    - tests
  requires:
    - pip
    - pytest
    - simplejson
  imports:
    - jsonpickle
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://jsonpickle.github.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Python library for serializing any arbitrary object graph into JSON
  description: |
    jsonpickle is a library for the two-way conversion of complex Python
    objects and JSON. jsonpickle builds upon the existing JSON encoders,
    such as simplejson, json, and ujson.
  dev_url: https://github.com/jsonpickle/jsonpickle
  doc_url: https://github.com/jsonpickle/jsonpickle/blob/main/README.rst

extra:
  recipe-maintainers:
    - robmcmullen
    - ChrisBarker-NOAA
    - synapticarbors
